# HTTP 요청은 운영 대표 주소의 HTTPS로 전환한다.
server {
    listen 80;
    server_name zipsai.co.kr www.zipsai.co.kr;

    return 301 https://zipsai.co.kr$request_uri;
}

# www는 별도 서비스 주소로 사용하지 않고 대표 주소로 통일한다.
server {
    listen 443 ssl;
    server_name www.zipsai.co.kr;

    ssl_certificate /etc/letsencrypt/live/zipsai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipsai.co.kr/privkey.pem;

    return 301 https://zipsai.co.kr$request_uri;
}

# 운영 서비스의 HTTPS 진입점이다.
server {
    listen 443 ssl;
    server_name zipsai.co.kr;

    ssl_certificate /etc/letsencrypt/live/zipsai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipsai.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /api 경로를 유지한 채 Backend Container로 전달한다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3의 React 정적 파일을 사용자 도메인으로 전달한다.
    location / {
        proxy_pass https://zipsai-prod-frontend.s3.ap-northeast-2.amazonaws.com;
        proxy_ssl_server_name on;
        proxy_set_header Host zipsai-prod-frontend.s3.ap-northeast-2.amazonaws.com;
        proxy_intercept_errors on;
        error_page 403 404 = /index.html;
    }

    # React Router의 직접 접근은 SPA 진입 파일로 처리한다.
    location = /index.html {
        proxy_pass https://zipsai-prod-frontend.s3.ap-northeast-2.amazonaws.com/index.html;
        proxy_ssl_server_name on;
        proxy_set_header Host zipsai-prod-frontend.s3.ap-northeast-2.amazonaws.com;
    }

}
