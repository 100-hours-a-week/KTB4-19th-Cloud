global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mysql-host
    static_configs:
      - targets: ["mysql-v1.prod.zipsai.internal:9100"]
        labels:
          environment: legacy-prod
          role: primary
      - targets: ["mysql-primary.staging.zipsai.internal:9100"]
        labels:
          environment: staging
          role: primary
      - targets: ["mysql-replica.staging.zipsai.internal:9100"]
        labels:
          environment: staging
          role: replica
      - targets: ["mysql-primary.prod.zipsai.internal:9100"]
        labels:
          environment: prod
          role: primary
      - targets: ["mysql-replica.prod.zipsai.internal:9100"]
        labels:
          environment: prod
          role: replica

  - job_name: mysql
    static_configs:
      - targets: ["mysql-v1.prod.zipsai.internal:9104"]
        labels:
          environment: legacy-prod
          role: primary
      - targets: ["mysql-primary.staging.zipsai.internal:9104"]
        labels:
          environment: staging
          role: primary
      - targets: ["mysql-replica.staging.zipsai.internal:9104"]
        labels:
          environment: staging
          role: replica
      - targets: ["mysql-primary.prod.zipsai.internal:9104"]
        labels:
          environment: prod
          role: primary
      - targets: ["mysql-replica.prod.zipsai.internal:9104"]
        labels:
          environment: prod
          role: replica
