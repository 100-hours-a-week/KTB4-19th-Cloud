name: zipsai-ai-observability
services:
  alloy:
    image: grafana/alloy:v1.21.0
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - 127.0.0.1:12345:12345
    volumes:
      - /opt/zipsai-ai-observability/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/zipsai-ai-observability/data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
