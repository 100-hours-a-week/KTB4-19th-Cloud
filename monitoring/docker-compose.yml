name: zipsai-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - /opt/zipsai-monitoring/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/monitoring/prometheus:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - 3100:3100
    volumes:
      - /opt/zipsai-monitoring/config/loki.yml:/etc/loki/loki.yml:ro
      - /data/monitoring/loki:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 127.0.0.1:3000:3000
    secrets:
      - grafana_admin_password
    volumes:
      - /opt/zipsai-monitoring/config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - /data/monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

secrets:
  grafana_admin_password:
    file: /opt/zipsai-monitoring/secrets/grafana-admin-password
