global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ai-application
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true
    static_configs:
      - targets: ["ai-api.staging.zipsai.internal:8000"]
        labels:
          environment: staging
          service: ai-api
      - targets: ["embedding.staging.zipsai.internal:8000"]
        labels:
          environment: staging
          service: embedding
      - targets: ["ai-api.prod.zipsai.internal:8000"]
        labels:
          environment: prod
          service: ai-api
      - targets: ["embedding.prod.zipsai.internal:8000"]
        labels:
          environment: prod
          service: embedding

  - job_name: migration-application
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["mysql-source.staging.zipsai.internal:8080"]
        labels:
          environment: staging
          service: backend
      - targets: ["mysql-source.staging.zipsai.internal:8081"]
        labels:
          environment: staging
          service: migration-worker
      - targets: ["mysql-v1.prod.zipsai.internal:8080"]
        labels:
          environment: prod
          service: backend
      # V2 복원 후 전용 Worker 기동 전에는 DOWN이 정상이다. 0 처리로 숨기지 않는다.
      - targets: ["mysql-v1.prod.zipsai.internal:8081"]
        labels:
          environment: prod
          service: migration-worker

  - job_name: mysql-host
    static_configs:
      - targets: ["mysql-v1.prod.zipsai.internal:9100"]
        labels:
          environment: legacy-prod
          role: primary
      - targets: ["mysql-source.staging.zipsai.internal:9100"]
        labels:
          environment: staging
          role: source
      - targets: ["mysql-primary.staging.zipsai.internal:9100"]
        labels:
          environment: staging
          role: primary
      - targets: ["mysql-primary.prod.zipsai.internal:9100"]
        labels:
          environment: prod
          role: primary
      - targets: ["mysql-replica.prod.zipsai.internal:9100"]
        labels:
          environment: prod
          role: replica

  - job_name: mysql
    static_configs:
      - targets: ["mysql-v1.prod.zipsai.internal:9104"]
        labels:
          environment: legacy-prod
          role: primary
      - targets: ["mysql-source.staging.zipsai.internal:9104"]
        labels:
          environment: staging
          role: source
      - targets: ["mysql-primary.staging.zipsai.internal:9104"]
        labels:
          environment: staging
          role: primary
      - targets: ["mysql-primary.prod.zipsai.internal:9104"]
        labels:
          environment: prod
          role: primary
      - targets: ["mysql-replica.prod.zipsai.internal:9104"]
        labels:
          environment: prod
          role: replica
