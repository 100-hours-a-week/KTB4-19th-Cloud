name: Cloud CD

# 자동 배포하지 않는다. 운영자가 GitHub Actions 화면에서 main Commit을 선택해 실행한다.
on:
  workflow_dispatch:
    inputs:
      cloud_commit_sha:
        description: 배포할 main Commit SHA (이전 정상 설정 롤백 시 해당 SHA 입력)
        required: true
        type: string

# id-token은 GitHub가 AWS OIDC Role을 임시로 Assume하기 위해 필요하다.
permissions:
  contents: read
  id-token: write

# V1에서 고정된 AWS 배포 대상이다. Secret이 아닌 식별 정보만 둔다.
env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  INSTANCE_ID: i-06c0ca0d997f03792
  APP_DIR: /opt/zipsai

jobs:
  deploy:
    name: Compose와 Nginx 설정 배포
    # workflow_dispatch도 실행할 브랜치를 선택할 수 있다.
    # 작업 브랜치의 Compose 설정이 운영 EC2에 배포되지 않도록 main만 허용한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # 먼저 main 전체 이력을 받아 입력 SHA가 운영 이력인지 검증한다.
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 작업 브랜치나 임의 Commit의 설정이 운영 EC2에 반영되지 않도록 main 이력만 허용한다.
      - name: Verify and checkout requested Cloud commit
        id: version
        env:
          COMMIT_INPUT: ${{ inputs.cloud_commit_sha }}
        run: |
          set -euo pipefail

          DEPLOY_SHA="$(git rev-parse "${COMMIT_INPUT}^{commit}")"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"

          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # GitHub Cloud 저장소 Settings > Secrets and variables > Actions > Variables에
          # AWS_DEPLOY_ROLE_ARN으로 등록할 GitHub OIDC 배포 Role의 ARN이다.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send configuration to EC2
        id: send-command
        env:
          COMPOSE_FILE: compose.yaml
          NGINX_FILE: nginx/default.conf
          RESTART_METRICS_SCRIPT_FILE: monitoring/restart-metrics/zipsai-publish-restart-metrics.sh
          RESTART_METRICS_SERVICE_FILE: monitoring/restart-metrics/zipsai-restart-metrics.service
          RESTART_METRICS_TIMER_FILE: monitoring/restart-metrics/zipsai-restart-metrics.timer
          DEPLOY_SHA: ${{ steps.version.outputs.deploy_sha }}
        run: |
          # SSM Run Command는 파일 자체를 전송하지 않으므로, 배포 대상 파일을 Base64 문자열로 전달한다.
          COMPOSE_B64="$(base64 < "$COMPOSE_FILE" | tr -d '\n')"
          NGINX_B64="$(base64 < "$NGINX_FILE" | tr -d '\n')"

          # 이전 Cloud Commit을 선택해 설정만 롤백할 수 있도록 M7 파일은 해당 Commit에 있을 때만 설치한다.
          RESTART_METRICS_PRESENT=false
          RESTART_METRICS_SCRIPT_B64=""
          RESTART_METRICS_SERVICE_B64=""
          RESTART_METRICS_TIMER_B64=""
          if [[ -f "$RESTART_METRICS_SCRIPT_FILE" && -f "$RESTART_METRICS_SERVICE_FILE" && -f "$RESTART_METRICS_TIMER_FILE" ]]; then
            RESTART_METRICS_PRESENT=true
            RESTART_METRICS_SCRIPT_B64="$(base64 < "$RESTART_METRICS_SCRIPT_FILE" | tr -d '\n')"
            RESTART_METRICS_SERVICE_B64="$(base64 < "$RESTART_METRICS_SERVICE_FILE" | tr -d '\n')"
            RESTART_METRICS_TIMER_B64="$(base64 < "$RESTART_METRICS_TIMER_FILE" | tr -d '\n')"
          fi

          # EC2에서 순서대로 실행할 명령 목록을 SSM 형식(JSON)으로 만든다.
          # 각 서비스 레포 CD가 기록한 Image Tag는 유지하고, Compose·Nginx만 갱신한다.
          jq -n \
            --arg app_dir "$APP_DIR" \
            --arg aws_region "$AWS_REGION" \
            --arg ecr_registry "$ECR_REGISTRY" \
            --arg compose "$COMPOSE_B64" \
            --arg nginx "$NGINX_B64" \
            --arg restart_metrics_present "$RESTART_METRICS_PRESENT" \
            --arg restart_metrics_script "$RESTART_METRICS_SCRIPT_B64" \
            --arg restart_metrics_service "$RESTART_METRICS_SERVICE_B64" \
            --arg restart_metrics_timer "$RESTART_METRICS_TIMER_B64" \
            '{
              commands: (
                [
                "set -eu",
                ("sudo install -d -m 0755 " + $app_dir + "/nginx"),
                ("printf '\''%s'\'' '\''" + $compose + "'\'' | base64 -d | sudo tee " + $app_dir + "/compose.yaml > /dev/null"),
                ("printf '\''%s'\'' '\''" + $nginx + "'\'' | base64 -d | sudo tee " + $app_dir + "/nginx/default.conf > /dev/null"),
                ("sudo test -f " + $app_dir + "/.env"),
                ("BACKEND_IMAGE_TAG=$(sudo sed -n '\''s/^BACKEND_IMAGE_TAG=//p'\'' " + $app_dir + "/.env | head -n 1)"),
                ("AI_API_IMAGE_TAG=$(sudo sed -n '\''s/^AI_API_IMAGE_TAG=//p'\'' " + $app_dir + "/.env 2>/dev/null | head -n 1 || true)"),
                ("EMBEDDING_IMAGE_TAG=$(sudo sed -n '\''s/^EMBEDDING_IMAGE_TAG=//p'\'' " + $app_dir + "/.env 2>/dev/null | head -n 1 || true)"),
                "test -n \"$BACKEND_IMAGE_TAG\"",
                "if test -n \"$AI_API_IMAGE_TAG\" || test -n \"$EMBEDDING_IMAGE_TAG\"; then test -n \"$AI_API_IMAGE_TAG\" && test -n \"$EMBEDDING_IMAGE_TAG\"; fi",
                ("MYSQL_PASSWORD=$(aws ssm get-parameter --name /zipsai/prod/mysql/password --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("MYSQL_ROOT_PASSWORD=$(aws ssm get-parameter --name /zipsai/prod/mysql/root-password --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("JWT_SECRET=$(aws ssm get-parameter --name /zipsai/prod/jwt/secret --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("OPENROUTER_API_KEY=$(aws ssm get-parameter --name /zipsai/prod/ai/openrouter-api-key --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("QDRANT_ADMIN_API_KEY=$(aws ssm get-parameter --name /zipsai/prod/ai/qdrant-admin-api-key --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("QDRANT_READ_ONLY_API_KEY=$(aws ssm get-parameter --name /zipsai/prod/ai/qdrant-read-only-api-key --with-decryption --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("LLM_MODEL=$(aws ssm get-parameter --name /zipsai/prod/ai/llm-model --query Parameter.Value --output text --region " + $aws_region + ")"),
                ("{ printf '\''BACKEND_IMAGE_TAG=%s\\n'\'' \"$BACKEND_IMAGE_TAG\"; printf '\''AI_API_IMAGE_TAG=%s\\n'\'' \"$AI_API_IMAGE_TAG\"; printf '\''EMBEDDING_IMAGE_TAG=%s\\n'\'' \"$EMBEDDING_IMAGE_TAG\"; printf '\''MYSQL_PASSWORD=%s\\n'\'' \"$MYSQL_PASSWORD\"; printf '\''MYSQL_ROOT_PASSWORD=%s\\n'\'' \"$MYSQL_ROOT_PASSWORD\"; printf '\''JWT_SECRET=%s\\n'\'' \"$JWT_SECRET\"; printf '\''LLM_BASE_URL=https://openrouter.ai/api/v1\\n'\''; printf '\''OPENROUTER_API_KEY=%s\\n'\'' \"$OPENROUTER_API_KEY\"; printf '\''QDRANT_ADMIN_API_KEY=%s\\n'\'' \"$QDRANT_ADMIN_API_KEY\"; printf '\''QDRANT_READ_ONLY_API_KEY=%s\\n'\'' \"$QDRANT_READ_ONLY_API_KEY\"; printf '\''LLM_MODEL=%s\\n'\'' \"$LLM_MODEL\"; } | sudo tee " + $app_dir + "/.env > /dev/null"),
                ("sudo chown root:root " + $app_dir + "/.env && sudo chmod 600 " + $app_dir + "/.env"),
                ("aws ecr get-login-password --region " + $aws_region + " | sudo docker login --username AWS --password-stdin " + $ecr_registry),
                ("sudo docker compose --env-file " + $app_dir + "/.env -f " + $app_dir + "/compose.yaml config -q"),
                ("sudo docker compose --env-file " + $app_dir + "/.env -f " + $app_dir + "/compose.yaml up -d --remove-orphans --quiet-pull"),
                ("sudo docker compose --env-file " + $app_dir + "/.env -f " + $app_dir + "/compose.yaml restart nginx")
                ] +
                (if $restart_metrics_present == "true" then [
                "sudo install -d -m 0755 /usr/local/bin /etc/systemd/system",
                ("printf '\''%s'\'' '\''" + $restart_metrics_script + "'\'' | base64 -d | sudo tee /usr/local/bin/zipsai-publish-restart-metrics.sh > /dev/null"),
                ("printf '\''%s'\'' '\''" + $restart_metrics_service + "'\'' | base64 -d | sudo tee /etc/systemd/system/zipsai-restart-metrics.service > /dev/null"),
                ("printf '\''%s'\'' '\''" + $restart_metrics_timer + "'\'' | base64 -d | sudo tee /etc/systemd/system/zipsai-restart-metrics.timer > /dev/null"),
                "sudo chown root:root /usr/local/bin/zipsai-publish-restart-metrics.sh /etc/systemd/system/zipsai-restart-metrics.service /etc/systemd/system/zipsai-restart-metrics.timer",
                "sudo chmod 755 /usr/local/bin/zipsai-publish-restart-metrics.sh",
                "sudo chmod 644 /etc/systemd/system/zipsai-restart-metrics.service /etc/systemd/system/zipsai-restart-metrics.timer",
                "sudo systemctl daemon-reload",
                "sudo systemctl enable --now zipsai-restart-metrics.timer"
                ] else [] end)
              )
            }' > ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy Cloud configuration: $DEPLOY_SHA" \
            --query 'Command.CommandId' \
            --output text)"

          # 다음 단계에서 같은 SSM 실행 결과를 기다리기 위해 Command ID를 GitHub Actions 출력값으로 저장한다.
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 deployment
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          # SSM 명령이 끝날 때까지 기다린다. 실패한 경우에도 EC2의 오류 출력을 남긴 뒤 실패 처리한다.
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
