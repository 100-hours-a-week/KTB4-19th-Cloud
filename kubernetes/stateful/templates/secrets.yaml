{{- range $service, $keys := dict "rabbitmq" (list "password" "erlang-cookie") "redis" (list "password") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $service }}-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: v3-{{ $.Values.environment }}-parameter-store
    kind: ClusterSecretStore
  target:
    name: {{ $service }}-secret
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: /zipsai/v3/{{ $.Values.environment }}/shared/{{ $service }}-{{ . }}
    {{- end }}
{{- end }}
