apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  enabled_plugins: "[rabbitmq_peer_discovery_k8s,rabbitmq_prometheus]."
  rabbitmq.conf: |
    default_vhost = zipsai
    cluster_formation.peer_discovery_backend = k8s
    prometheus.return_per_object_metrics = true
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - {name: epmd, port: 4369}
    - {name: distribution, port: 25672}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: metrics, port: 15692, targetPort: metrics}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: {{ .Values.rabbitmq.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: broker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        environment: {{ .Values.environment }}
        role: general
      securityContext:
        fsGroup: 999
      {{- if eq .Values.environment "prod" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      {{- end }}
      initContainers:
        - name: fix-cookie-permissions
          image: {{ .Values.rabbitmq.image }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -ec
            - |
              # fsGroup can add group permissions when an existing PVC is mounted.
              # Erlang requires the cookie to be accessible by its owner only.
              if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
                chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie
                chmod 600 /var/lib/rabbitmq/.erlang.cookie
              fi
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "1", memory: 2Gi}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: RABBITMQ_USE_LONGNAME, value: "true"}
            - {name: RABBITMQ_NODENAME, value: "rabbit@$(POD_NAME).rabbitmq-headless.$(POD_NAMESPACE).svc.cluster.local"}
            - {name: RABBITMQ_DEFAULT_USER, value: zipsai_app}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: rabbitmq-secret, key: password}
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef: {name: rabbitmq-secret, key: erlang-cookie}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: epmd, containerPort: 4369}
            - {name: distribution, containerPort: 25672}
            - {name: metrics, containerPort: 15692}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_running]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf}
            - {name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins}
      volumes:
        - name: config
          configMap: {name: rabbitmq-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: v3-gp3
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
{{- if eq .Values.environment "prod" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
{{- end }}
