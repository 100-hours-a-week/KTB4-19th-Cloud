apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: v3-observability-parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  conditions:
    - namespaces: [observability]
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      role: arn:aws:iam::{{ required "Set monitoring accountId" .Values.accountId }}:role/v3-observability-parameter-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: v3-observability-parameter-store
  target: {name: grafana-admin}
  data:
    - secretKey: admin-user
      remoteRef:
        key: /zipsai/v3/observability/grafana/admin-user
    - secretKey: admin-password
      remoteRef:
        key: /zipsai/v3/observability/grafana/admin-password
