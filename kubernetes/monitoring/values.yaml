accountId: ""
kube-prometheus-stack:
  fullnameOverride: monitoring
  kubeControllerManager: {enabled: false}
  kubeScheduler: {enabled: false}
  kubeEtcd: {enabled: false}
  kubeProxy: {enabled: false}
  prometheusOperator:
    nodeSelector: {role: observability}
    tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
    admissionWebhooks:
      deployment:
        nodeSelector: {role: observability}
        tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
      patch:
        nodeSelector: {role: observability}
        tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
  prometheus:
    prometheusSpec:
      replicas: 1
      nodeSelector: {role: observability}
      tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
      retention: 15d
      retentionSize: 24GB
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "1", memory: 1536Mi}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: v3-gp3
            accessModes: [ReadWriteOnce]
            resources:
              requests: {storage: 30Gi}
      serviceMonitorSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      replicas: 1
      nodeSelector: {role: observability}
      tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
  grafana:
    nodeSelector: {role: observability}
    tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      type: pvc
      storageClassName: v3-gp3
      accessModes: [ReadWriteOnce]
      size: 5Gi
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
    sidecar:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 50m, memory: 256Mi}
  kube-state-metrics:
    nodeSelector: {role: observability}
    tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
  prometheus-node-exporter:
    tolerations: [{operator: Exists}]
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}

loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary
  serviceAccount:
    create: true
    name: loki
  loki:
    auth_enabled: false
    commonConfig: {replication_factor: 1}
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index: {prefix: index_, period: 24h}
    storage:
      type: s3
      bucketNames: {chunks: "", ruler: "", admin: ""}
      s3: {region: ap-northeast-2}
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3
    ingester:
      wal:
        enabled: true
        dir: /var/loki/wal
        replay_memory_ceiling: 512MB
    limits_config:
      retention_period: 720h
      retention_stream:
        - selector: '{namespace="staging"}'
          priority: 1
          period: 168h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
  singleBinary:
    replicas: 1
    nodeSelector: {role: observability}
    tolerations: [{key: role, operator: Equal, value: observability, effect: NoSchedule}]
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    # Keep WAL and compactor markers across node replacement as well as S3 objects.
    persistence:
      enabled: true
      storageClass: v3-gp3
      size: 10Gi
      enableStatefulSetAutoDeletePVC: false
  read: {replicas: 0}
  write: {replicas: 0}
  backend: {replicas: 0}
  gateway: {enabled: false}
  lokiCanary: {enabled: false}
  test: {enabled: false}
  chunksCache: {enabled: false}
  resultsCache: {enabled: false}
  sidecar:
    rules: {enabled: false}

alloy:
  fullnameOverride: alloy
  controller:
    type: daemonset
    tolerations:
      - {key: role, operator: Equal, value: observability, effect: NoSchedule}
      - {key: role, operator: Equal, value: gpu, effect: NoSchedule}
  alloy:
    mounts:
      varlog: true
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef: {fieldPath: spec.nodeName}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }
        discovery.relabel "logs" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator = "/"
            target_label = "__path__"
            replacement = "/var/log/pods/*$1/*.log"
          }
        }
        local.file_match "pods" {
          path_targets = discovery.relabel.logs.output
        }
        loki.source.file "pods" {
          targets = local.file_match.pods.targets
          forward_to = [loki.process.cri.receiver]
        }
        loki.process "cri" {
          stage.cri {}
          forward_to = [loki.write.local.receiver]
        }
        loki.write "local" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
