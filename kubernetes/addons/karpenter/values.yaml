karpenter:
  serviceAccount:
    name: karpenter
  nodeSelector:
    kubernetes.io/os: linux
    role: general
  settings:
    clusterName: zipsai-v3-eks
    interruptionQueue: zipsai-v3-eks-karpenter

cluster:
  subnetIds: []
  securityGroupId: ""
  amiVersion: ""

gpu:
  enabled: false
  rootVolumeSize: 40Gi

nvidia-device-plugin:
  nodeSelector:
    environment: prod
    role: gpu
  tolerations:
    - key: role
      operator: Equal
      value: gpu
      effect: NoSchedule

generalPools:
  # Keep 4 vCPU of Standard On-Demand headroom while V2 and V3 coexist.
  prod:
    cpu: "12"
    memory: 64Gi
  staging:
    cpu: "4"
    memory: 32Gi
