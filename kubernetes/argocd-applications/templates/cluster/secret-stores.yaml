{{- if .Values.secretStores.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-19th-Cloud.git
    targetRevision: main
    path: kubernetes/platform
    helm:
      valuesObject:
        namespaces:
          enabled: false
        secretStores:
          enabled: true
          accountId: {{ required "Set secretStores.accountId" .Values.secretStores.accountId | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
