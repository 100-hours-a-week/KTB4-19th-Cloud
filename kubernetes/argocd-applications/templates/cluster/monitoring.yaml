{{- if .Values.monitoring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-19th-Cloud.git
    targetRevision: main
    path: kubernetes/monitoring
    helm:
      valuesObject:
        accountId: {{ required "Set monitoring.accountId" .Values.monitoring.accountId | quote }}
        loki:
          loki:
            storage:
              bucketNames:
                chunks: {{ required "Set monitoring.lokiBucket from Terraform output" .Values.monitoring.lokiBucket | quote }}
                ruler: {{ .Values.monitoring.lokiBucket | quote }}
                admin: {{ .Values.monitoring.lokiBucket | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
