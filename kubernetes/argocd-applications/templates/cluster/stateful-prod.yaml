{{- if .Values.stateful.prodEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stateful-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-19th-Cloud.git
    targetRevision: main
    path: kubernetes/stateful
    helm:
      valueFiles: [values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
