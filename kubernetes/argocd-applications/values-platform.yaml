# Initial cluster foundation. Runtime VPC/account values come from bootstrap.
platform:
  enabled: true
  networkPolicy:
    enabled: true
  environments:
    staging:
      mysqlCidrs:
        - 10.0.20.200/32
      qdrantCidrs:
        - 10.0.10.83/32
    prod:
      mysqlCidrs:
        - 10.0.20.196/32
        - 10.0.21.153/32
      qdrantCidrs:
        - 10.0.10.82/32

albController:
  enabled: true

externalSecrets:
  enabled: true

metricsServer:
  enabled: true

reloader:
  enabled: true

secretStores:
  enabled: true

karpenter:
  enabled: true
  # Initial staging has one eligible Managed Node for the controller.
  controllerReplicas: 1

# Persistent storage and staging data services. Production remains disabled.
stateful:
  storageEnabled: true
  stagingEnabled: true

monitoring:
  enabled: true
  accountId: "929368845727"
  lokiBucket: zipsai-v3-loki-929368845727
