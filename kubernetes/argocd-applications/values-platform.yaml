# Initial cluster foundation. Runtime VPC/account values come from bootstrap.
platform:
  enabled: true
  networkPolicy:
    enabled: true
  ingress:
    enabled: true
    environments: [staging, prod]
    certificateArn: arn:aws:acm:ap-northeast-2:929368845727:certificate/30109a25-5f57-448c-85b1-51238d2ec735
    publicSubnetIds:
      - subnet-0d3960b65ce95d391
      - subnet-03a9a4e9df8e05d6b
  environments:
    staging:
      mysqlCidrs:
        - 10.0.20.200/32
      qdrantCidrs:
        - 10.0.10.83/32
    prod:
      host: api.zipsai.co.kr
      mysqlCidrs:
        - 10.0.20.196/32
        - 10.0.21.153/32
      qdrantCidrs:
        - 10.0.10.82/32

albController:
  enabled: true

externalSecrets:
  enabled: true

metricsServer:
  enabled: true

reloader:
  enabled: true

secretStores:
  enabled: true

karpenter:
  enabled: true
  gpuEnabled: true
  # Initial staging has one eligible Managed Node for the controller.
  controllerReplicas: 1

# Persistent storage and environment data services. Prod uses manual Sync.
stateful:
  storageEnabled: true
  stagingEnabled: true
  prodEnabled: true

monitoring:
  enabled: true
  accountId: "929368845727"
  lokiBucket: zipsai-v3-loki-929368845727

# Application manifests are owned by the Backend and AI repositories.
applications:
  staging:
    resident-api: true
    manager-api: true
    chat-consumer: true
    complaint-feedback-batch: true
    ai-api: true
    embedding-service: true
  prod:
    resident-api: true
    manager-api: true
    chat-consumer: true
    complaint-feedback-batch: true
    ai-api: true
    embedding-service: true
