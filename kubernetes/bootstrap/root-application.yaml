apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: v3-root
  namespace: argocd
spec:
  project: v3-bootstrap
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-19th-Cloud.git
    targetRevision: main
    path: kubernetes/argocd-applications
    helm:
      valueFiles:
        - values.yaml
        - values-platform.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
