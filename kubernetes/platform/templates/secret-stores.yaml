{{- if .Values.secretStores.enabled }}
{{- $account := required "Set secretStores.accountId before enabling SecretStores" .Values.secretStores.accountId }}
{{- range $environment, $_ := .Values.environments }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: v3-{{ $environment }}-parameter-store
spec:
  conditions:
    - namespaces: [{{ $environment }}]
  provider:
    aws:
      service: ParameterStore
      region: {{ $.Values.region }}
      role: arn:aws:iam::{{ $account }}:role/v3-{{ $environment }}-parameter-reader
{{- end }}
{{- end }}
