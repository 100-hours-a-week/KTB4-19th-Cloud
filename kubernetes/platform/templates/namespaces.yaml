{{- if .Values.namespaces.enabled }}
{{- $namespaces := concat (keys .Values.environments) (list "karpenter" "external-secrets" "reloader" "observability") | uniq | sortAlpha }}
{{- range $namespace := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
{{- end }}
